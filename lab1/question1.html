<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- headings -->
    <h1>This is h1</h1>
    <h2>This is h2</h2>
    <h3>This is h3</h3>

    <!-- paragraphs -->

    <p>
        This is a paragraph written using the p tag.
        <strong>This text is important.</strong>
        <b>This text is bold</b>
        <i>Italic text</i>
        <em>This text is emphasized.</em>
    </p>

    <!-- i makes text capital -->
    <!-- <em> => makes text italic + emphasized meaning -->
    <!-- <b> => makes text bold -->
    <!-- <strong> => makes text bold + important -->
</body>

</html>
